<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Summarizer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- pdf.js library from Mozilla for reading PDF files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for a more modern look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Style for the file upload area */
        #drop-zone {
            border: 2px dashed #cbd5e1;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
        #drop-zone.drag-over {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }
        /* Simple animation for the loader */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        
        <!-- Header Section -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900">AI PDF Summarizer</h1>
            <p class="text-slate-600 mt-2">Upload a PDF, choose your analysis, and let AI do the work.</p>
        </header>

        <main class="bg-white p-6 md:p-8 rounded-2xl shadow-lg">

            <!-- Step 1: PDF Upload -->
            <div id="upload-section">
                <h2 class="text-xl font-semibold mb-4 text-slate-900">1. Upload your PDF</h2>
                <div id="drop-zone" class="relative flex flex-col items-center justify-center w-full p-8 rounded-lg text-center cursor-pointer hover:bg-slate-100">
                    <input type="file" id="pdf-upload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".pdf">
                    <svg class="w-12 h-12 text-slate-400 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m.75 12l3 3m0 0l3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                    </svg>
                    <p class="text-slate-600 font-medium">Drag & drop your PDF here, or click to select a file</p>
                    <p class="text-sm text-slate-500 mt-1">Max file size: 10MB</p>
                </div>
                <div id="file-info" class="mt-4 text-center hidden">
                    <p class="text-green-600 font-medium"></p>
                </div>
            </div>

            <!-- Step 2: Analysis Options -->
            <div id="options-section" class="mt-8">
                <h2 class="text-xl font-semibold mb-4 text-slate-900">2. What do you need?</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="flex items-center p-4 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 transition-colors">
                        <input type="checkbox" name="analysis-option" value="Key Highlights" class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="ml-3 text-slate-700 font-medium">Key Highlights</span>
                    </label>
                    <label class="flex items-center p-4 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 transition-colors">
                        <input type="checkbox" name="analysis-option" value="Q&A" class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="ml-3 text-slate-700 font-medium">Q&A Generation</span>
                    </label>
                    <label class="flex items-center p-4 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 transition-colors">
                        <input type="checkbox" name="analysis-option" value="MCQs" class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="ml-3 text-slate-700 font-medium">MCQ Generation</span>
                    </label>
                    <label class="flex items-center p-4 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 transition-colors">
                        <input type="checkbox" name="analysis-option" value="Mistake Finder & Corrector" class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="ml-3 text-slate-700 font-medium">Mistake Finder & Corrector</span>
                    </label>
                </div>
            </div>

            <!-- Action Button -->
            <div class="mt-8 text-center">
                <button id="summarize-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all disabled:bg-slate-400 disabled:cursor-not-allowed">
                    Generate Analysis
                </button>
            </div>

            <!-- Step 3: Results -->
            <div id="results-section" class="mt-10 hidden">
                <h2 class="text-2xl font-bold mb-6 text-slate-900 border-b pb-3">Analysis Results</h2>
                <div id="loader" class="flex justify-center items-center p-8">
                    <div class="loader h-12 w-12 rounded-full"></div>
                    <p class="ml-4 text-slate-600">AI is analyzing your document... this may take a moment.</p>
                </div>
                <div id="results-content" class="space-y-6"></div>
                 <div id="error-message" class="hidden mt-4 p-4 bg-red-100 text-red-800 rounded-lg"></div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="text-center mt-8 text-sm text-slate-500">
            <p>Powered by OpenRouter AI</p>
        </footer>
    </div>

    <script>
        // Set the workerSrc for pdf.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js`;

        // DOM element references
        const dropZone = document.getElementById('drop-zone');
        const pdfUpload = document.getElementById('pdf-upload');
        const fileInfo = document.getElementById('file-info');
        const summarizeBtn = document.getElementById('summarize-btn');
        const resultsSection = document.getElementById('results-section');
        const resultsContent = document.getElementById('results-content');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');

        let pdfText = '';
        let selectedFile = null;

        // --- Drag and Drop Functionality ---
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                handleFile(files[0]);
            }
        });
        
        // Handle file selection via click
        pdfUpload.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        /**
         * Handles the selected PDF file, validates it, and triggers text extraction.
         * @param {File} file The PDF file selected by the user.
         */
        function handleFile(file) {
            // Reset previous state
            pdfText = '';
            selectedFile = null;
            errorMessage.classList.add('hidden');
            summarizeBtn.disabled = true;

            if (file.size > 10 * 1024 * 1024) { // 10MB limit
                showError('File is too large. Please upload a PDF under 10MB.');
                return;
            }
            selectedFile = file;
            fileInfo.classList.remove('hidden');
            fileInfo.querySelector('p').textContent = `Processing: ${file.name}`;
            fileInfo.querySelector('p').classList.remove('text-red-600', 'text-green-600');
            fileInfo.querySelector('p').classList.add('text-slate-600');
            
            extractTextFromPdf(file);
        }

        /**
         * Extracts all text content from a given PDF file using pdf.js.
         * @param {File} file The PDF file.
         */
        async function extractTextFromPdf(file) {
            summarizeBtn.textContent = 'Processing PDF...';
            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument({data: typedarray}).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }

                    // *** FIX: Check if the extracted text is empty ***
                    if (!fullText.trim()) {
                        showError('Could not extract text from this PDF. It might be a scanned document without selectable text. Please try a different file.');
                        summarizeBtn.textContent = 'Generate Analysis';
                        summarizeBtn.disabled = true;
                        return;
                    }

                    pdfText = fullText;
                    fileInfo.querySelector('p').textContent = `✅ Successfully loaded: ${selectedFile.name}`;
                    fileInfo.querySelector('p').classList.add('text-green-600');
                    summarizeBtn.disabled = false;
                    summarizeBtn.textContent = 'Generate Analysis';

                } catch (error) {
                    console.error('Error parsing PDF:', error);
                    showError('Could not read the PDF file. It might be corrupted or protected.');
                    pdfText = '';
                    summarizeBtn.textContent = 'Generate Analysis';
                    summarizeBtn.disabled = true;
                }
            };
            fileReader.readAsArrayBuffer(file);
        }

        // --- API Call and Result Handling ---
        summarizeBtn.addEventListener('click', async () => {
            if (!pdfText) {
                showError('Please upload a PDF file first.');
                return;
            }

            const selectedOptions = Array.from(document.querySelectorAll('input[name="analysis-option"]:checked')).map(cb => cb.value);

            if (selectedOptions.length === 0) {
                showError('Please select at least one analysis option.');
                return;
            }

            // Show loader and results section
            resultsSection.classList.remove('hidden');
            loader.style.display = 'flex';
            resultsContent.innerHTML = '';
            errorMessage.classList.add('hidden');

            try {
                // Construct the prompt for the AI model
                const prompt = `You are an expert academic assistant. I have extracted the following text from a PDF document. Please analyze it and perform the following tasks: ${selectedOptions.join(', ')}.

                **Extracted Text:**
                """
                ${pdfText.substring(0, 15000)}
                """

                ---

                **Instructions:**
                For each requested task, provide a clear and well-structured response. Format the entire output in simple Markdown. Use headings for each section.

                - If 'Key Highlights' is requested, provide a bulleted list of the main points.
                - If 'Q&A' is requested, generate a list of insightful questions and their corresponding answers based on the text.
                - If 'MCQs' is requested, create multiple-choice questions with one correct answer and three plausible distractors. Clearly indicate the correct answer for each question.
                - If 'Mistake Finder & Corrector' is requested, identify any potential errors (grammatical, spelling, or factual inconsistencies within the text) and provide the corrected version with the change highlighted. If no mistakes are found, state that "No mistakes were found."
                `;

                const response = await callOpenRouterAPI(prompt);
                displayResults(response);

            } catch (error) {
                console.error('API Error:', error);
                showError(`An error occurred while contacting the AI. Details: ${error.message}`);
            } finally {
                loader.style.display = 'none';
            }
        });

        /**
         * Makes the API call to OpenRouter.
         * @param {string} content The prompt to send to the model.
         * @returns {Promise<string>} The content of the AI's response.
         */
        async function callOpenRouterAPI(content) {
            const OPENROUTER_API_KEY = "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";
            
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    // *** FIX: Switched to a more stable model to avoid internal server errors ***
                    "model": "mistralai/mistral-7b-instruct:free", 
                    "messages": [
                        { "role": "user", "content": content }
                    ]
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                // Provide a more specific error message if available
                const message = errorData.error?.message || `API request failed with status ${response.status}`;
                throw new Error(message);
            }

            const data = await response.json();
            
            if (data && data.choices && data.choices.length > 0 && data.choices[0].message) {
                return data.choices[0].message.content;
            } else {
                console.error("Unexpected API response structure:", data);
                throw new Error("Received an unexpected response format from the AI service.");
            }
        }

        /**
         * Displays the AI-generated results in the UI.
         * @param {string} markdownText The markdown text from the API.
         */
        function displayResults(markdownText) {
            // A simple markdown to HTML converter
            let html = markdownText
                .replace(/^### (.*$)/gim, '<h3 class="text-lg font-semibold mt-4 mb-2">$1</h3>')
                .replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold mt-6 mb-3 border-b pb-2">$1</h2>')
                .replace(/^# (.*$)/gim, '<h1 class="text-2xl font-bold mt-8 mb-4">$1</h1>')
                .replace(/^\* (.*$)/gim, '<li class="ml-5 list-disc">$1</li>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            const resultContainer = document.createElement('div');
            resultContainer.className = 'prose max-w-none text-slate-700';
            resultContainer.innerHTML = html;

            const copyButton = document.createElement('button');
            copyButton.textContent = 'Copy All Results';
            copyButton.className = 'mt-6 bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors';
            copyButton.onclick = () => {
                // Use a temporary textarea to copy text to clipboard
                const textarea = document.createElement('textarea');
                textarea.value = markdownText;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    copyButton.textContent = 'Copied!';
                    setTimeout(() => { copyButton.textContent = 'Copy All Results'; }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                    copyButton.textContent = 'Copy Failed';
                }
                document.body.removeChild(textarea);
            };
            
            resultsContent.appendChild(resultContainer);
            resultsContent.appendChild(copyButton);
        }

        /**
         * Displays an error message to the user.
         * @param {string} message The error message to display.
         */
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            // Also show in file info if it's a file error
            if (selectedFile) {
                fileInfo.querySelector('p').textContent = `❌ Error with ${selectedFile.name}`;
                fileInfo.querySelector('p').classList.remove('text-green-600');
                fileInfo.querySelector('p').classList.add('text-red-600');
            }
        }

    </script>
</body>
</html>
